[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-ciclico"
version = "1.0.0"
description = "Pre-entrega 5: agente ReAct asíncrono con memoria SQLite"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-openai>=1,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12", "mypy>=1.15"]

[project.scripts]
agente = "agente.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
